<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#080a11">
<title>{% block title %}Panel{% endblock %} · Servidor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M6 17h5l2.5-7 4 13 2.5-6H26' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
{% block head %}{% endblock %}
</head><body>
<nav class="top"><div class="wrap">
<a class="logo" href="/"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5h4l2-6 3.5 11 2-5H21"/></svg></span>Saiperr<span class="c">Net</span><em>· Panel</em></a>
{% if user %}<div class="userbox">{% block navextra %}{% endblock %}<span class="me" title="{{ user.username }}">{{ user.username[:1]|upper }}</span>
<form method="post" action="/salir"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="sec small" title="Cerrar sesión" aria-label="Cerrar sesión"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg></button></form></div>{% endif %}
</div></nav>
<main><div class="wrap">
{% if flash %}<div class="msg {{ flash.kind }}" role="status">{{ flash.msg }}</div>{% endif %}
{% block body %}{% endblock %}
</div></main>
</body></html>
