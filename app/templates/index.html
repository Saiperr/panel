{% extends "base.html" %}{% block title %}Panel{% endblock %}
{% block head %}<meta name="csrf" content="{{ csrf }}"><script src="/static/app.js?v={{ asset_v }}" defer></script>{% endblock %}
{% block bodyattr %} class="shell"{% endblock %}
{% block body %}
<aside class="side">
<a class="brand" href="#dashboard"><span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 22V10l12 12V10"/></svg></span><span id="brand">{{ panel_name() }}</span></a>
<nav id="nav" aria-label="Secciones"></nav>
<div class="side-foot"><span class="avatar" id="av" aria-hidden="true"></span><div class="me"><b id="me-name">&nbsp;</b><small id="me-role">&nbsp;</small></div>
<form method="post" action="/salir"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="ib" title="Cerrar sesión" aria-label="Cerrar sesión"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg></button></form></div>
</aside>
<div class="main">
<header class="bar"><div class="bar-l"><h1 id="title">&nbsp;</h1><p id="subtitle">&nbsp;</p></div>
<div class="bar-r"><span class="chip" id="host" hidden></span><span class="live" id="live"><i></i><b>Conectando…</b></span></div></header>
<div class="view" id="view"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
{% endblock %}
