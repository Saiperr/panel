{% extends "base.html" %}{% block title %}Entrar{% endblock %}{% block body %}
<div class="auth"><h1>Panel del servidor</h1><p class="sub">Estado del servidor en tiempo real.</p>
<div class="card"><form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<label for="u">Usuario</label><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
<label for="p">Contraseña</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<button class="wide">Entrar</button></form></div></div>{% endblock %}
